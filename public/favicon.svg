<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141525"/>
      <stop offset="60%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="favRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B6B"/>
      <stop offset="40%" stop-color="#FF3B6B" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8A5CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF3B6B"/>
      <stop offset="30%" stop-color="#FF6B8B"/>
      <stop offset="70%" stop-color="#8A5CFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B6B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8A5CFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="#08090C"/>
  <rect x="18" y="18" width="476" height="476" rx="100" fill="url(#favBg)" stroke="url(#favRim)" stroke-width="4"/>

  <!-- C-Emblem Geometry -->
  <!-- Center is at (256, 256). Outer circle R=170, Inner cut R=98, opening angle ~65 deg on right -->
  <g filter="url(#glow)">
    <path d="M 370 160
             A 170 170 0 1 0 370 352
             L 326 314
             A 120 120 0 1 1 326 198
             Z"
          fill="url(#cGrad)"/>

    <!-- Integrated Play Triangle -->
    <path d="M 235 190
             L 320 256
             L 235 322
             Z"
          fill="url(#playGrad)"
          stroke="#FFFFFF"
          stroke-opacity="0.3"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>
</svg>
