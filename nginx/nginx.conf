# ============================================================================
# Velora Streaming Platform - High Performance Nginx Configuration
# Self-Hosted / Free-First Reverse Proxy & Direct Static HLS Video Delivery
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting & Connection limits to protect server resources
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstream to Next.js Application Server
    upstream velora_app {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client body size for video uploads
        client_max_body_size 4000M;

        # --------------------------------------------------------------------
        # 1. Direct Static HLS Video Delivery (Bypasses Node.js application)
        # --------------------------------------------------------------------
        location /media/ {
            alias /data/velora/;
            autoindex off;

            # HTTP Range Requests (206 Partial Content)
            add_header Accept-Ranges bytes;

            # CORS Headers for Video Streaming
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Type";

            # Immutable caching for TS video segments
            location ~* \.ts$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Access-Control-Allow-Origin *;
            }

            # Short caching for HLS master & variant playlists
            location ~* \.m3u8$ {
                add_header Cache-Control "public, max-age=2, must-revalidate";
                add_header Access-Control-Allow-Origin *;
            }

            # Thumbnails & Post-Processing Images
            location ~* \.(jpg|jpeg|png|webp)$ {
                add_header Cache-Control "public, max-age=604800";
                add_header Access-Control-Allow-Origin *;
            }
        }

        # --------------------------------------------------------------------
        # 2. Upload and API Endpoints
        # --------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://velora_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------------------------
        # 3. Next.js Web Application & Dynamic Pages
        # --------------------------------------------------------------------
        location / {
            limit_conn addr_limit 50;
            proxy_pass http://velora_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
